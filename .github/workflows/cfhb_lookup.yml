name: CFHB Tournament Lookup

on:
  workflow_dispatch:
    inputs:
      tournament_slug:
        description: 'Tournament slug to look up (without "tournament/" prefix, e.g., "example-2024")'
        required: true
        type: string

permissions:
  contents: read

jobs:
  lookup-results:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Fetch tournament results
        env:
          STARTGG_API_TOKEN: ${{ secrets.STARTGG_API_TOKEN }}
        run: |
          echo "🎯 Looking up tournament: ${{ inputs.tournament_slug }}"
          python cfhb_results.py --tournament-slug "${{ inputs.tournament_slug }}" --dry-run
